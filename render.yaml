services:
  - type: web
    name: ksg-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      python -m spacy download en_core_web_sm
    startCommand: |
      cd backend
      python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ksg-database
          property: connectionString
      - key: CORS_ORIGINS
        value: https://ksg-frontend.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
    healthCheckPath: /api/health

  - type: web
    name: ksg-frontend
    runtime: static
    region: oregon
    plan: free
    branch: main
    buildCommand: |
      npm install
      npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://ksg-backend.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ksg-database
    plan: free
    databaseName: ksg_db
    user: ksg_user
    region: oregon